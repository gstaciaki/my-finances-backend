name: Continuos Integrations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: myfinances_user
          POSTGRES_PASSWORD: myfinances_password
          POSTGRES_DB: myfinances_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL_TEST: postgresql://myfinances_user:myfinances_password@localhost:5432/myfinances_test
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create .env
        run: cp .env.example .env

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: pnpm test:db:migrate

      - name: Check for Type errors
        run: pnpm tsc --noEmit

      - name: Run tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: pnpm test

  code-quality:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create .env
        run: cp .env.example .env

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint:check
